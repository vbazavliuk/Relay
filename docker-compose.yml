# ==============================================================================
# DO NOT RUN LOCALLY ON MACOS. THIS STACK IS HOSTED ON REMOTE LINUX:
# valentin@192.168.1.110 in /opt/stacks/relay/
#
# Management commands must be executed on the remote server:
#   ssh valentin@192.168.1.110 "cd /opt/stacks/relay && docker compose [ps|logs|restart|up -d|down]"
# ==============================================================================

services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relay-bot
    restart: unless-stopped
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
