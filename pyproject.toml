[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-media-bot"
version = "1.0.0"
description = "High-performance Telegram media downloader bot with aspect ratio preservation and sound guarantee"
readme = "README.md"
authors = [{ name = "Valentyn Bazavliuk", email = "valentin.bazavliuk@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4.0,<4.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "yt-dlp>=2024.0.0",
    "static-ffmpeg>=2.5",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/vbazavliuk/Relay"
Repository = "https://github.com/vbazavliuk/Relay.git"
Issues = "https://github.com/vbazavliuk/Relay/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
