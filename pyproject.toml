[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-media-bot"
version = "1.0.0"
description = "High-performance Telegram media downloader bot with aspect ratio preservation and sound guarantee"
readme = "README.md"
authors = [{ name = "Valentyn Bazavliuk", email = "valentin.bazavliuk@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.31.0",
    "aiohttp==3.14.5",
    "yt-dlp==2026.10.26",
    "static-ffmpeg==3.0",
    "python-dotenv==1.2.4",
]

[project.urls]
Homepage = "https://github.com/vbazavliuk/Relay"
Repository = "https://github.com/vbazavliuk/Relay.git"
Issues = "https://github.com/vbazavliuk/Relay/issues"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".agents",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
